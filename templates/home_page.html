<!--html code for the home page of the site-->
{% extends "page_template.html" %}
{% block title %}OpenDoor{% endblock %}
{% block content %}
    
<head>
    <style>
        h1{
            text-align: center;
            font-size: xx-large;
        }
        p{
            text-align: center;
            font-size: x-large;
        }

    </style>
</head>
    <h1> Welcome to OpenDoor </h1>
        <p> How can we help you today? </p>
        
    <div class = center>
    <textarea id="user_input"></textarea>
    <button id="send_button">Send</button>
    <div id="chat_window"></div>
    </div>

<script defer>
const input = document.getElementById("user_input");
const sendBtn = document.getElementById("send_button");
const chat = document.getElementById("chat_window");

sendBtn.addEventListener("click", () => {
    const message = input.value;
    if(message === "")
        return
    addMessage("You", message);
    sendToFlask(message);
    input.value = "";
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
            const message = input.value.trim();
        if(message === "")
            return
        addMessage("You", message);
        sendToFlask(message);
        input.value = "";
    }
});

function sendToFlask(text) {
    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: text })
    })
    .then(res => res.json())
    .then(data => {
        addMessage("Bot", data.reply, data.resources);
    })
    .catch(error => {
        console.error("Error:", error);
        addMessage("Bot", "Something went wrong.");
    });
}

function addMessage(sender, text, resources = []) {
    const msg = document.createElement("div");
    msg.textContent = `${sender}: ${text}`;
    chat.appendChild(msg);
    const list = document.createElement("ul")
    for (const resource of resources) { 
        const resourceElement = document.createElement("li")
        resourceElement.innerHTML = ('<a href ="' + resource.url + '">' + resource.name + '</a>')
        list.appendChild(resourceElement)
    }
    msg.appendChild(list)
}
</script>
{% endblock %}
